esphome:
  name: faderbuddy-v01
  friendly_name: FaderBuddy V0.1

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Accelerator6666/FaderBuddy.git
      ref: eight-channel-console
    components: [fader_buddy]

i2c:
  sda: GPIO12
  scl: GPIO13
  scan: true

sensor:
  - platform: template
    name: "Fader Position"
    id: fader_position
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    name: "Fader Touch"
    id: fader_touch

number:
  - platform: template
    name: "Fader Target"
    id: fader_target
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    set_action:
      - fader_buddy.remote_move_to:
          id: fader_1
          position: !lambda 'return (uint8_t)x;'
          layer: 0
          speed: 120

fader_buddy:
  - id: fader_1
    address: 0x20
    update_interval: 10ms
    layer_haptics:
      - layer: 0
        mode: smooth
        default_speed: 120
        value_change_min_interval: 25ms
    on_manual_move:
      then:
        - lambda: |-
            id(fader_position).publish_state(x);
            id(fader_target).publish_state(x);
            ESP_LOGI("fader", "Manual move: position=%u layer=%u", x, layer);
    on_touch_change:
      then:
        - lambda: |-
            id(fader_touch).publish_state(x);
            ESP_LOGI("fader", "Touch=%s layer=%u", x ? "ON" : "OFF", layer);
    on_double_tap:
      then:
        - lambda: |-
            ESP_LOGI("fader", "Double tap on layer=%u", layer);
