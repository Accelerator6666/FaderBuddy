esphome:
  name: faderbuddy-v02
  friendly_name: FaderBuddy V0.2

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Accelerator6666/FaderBuddy.git
      ref: eight-channel-console
    components: [fader_buddy]

i2c:
  sda: GPIO12
  scl: GPIO13
  scan: true

sensor:
  - platform: template
    name: "CH1 Position"
    id: ch1_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH2 Position"
    id: ch2_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH3 Position"
    id: ch3_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH4 Position"
    id: ch4_position
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    name: "CH1 Touch"
    id: ch1_touch
  - platform: template
    name: "CH2 Touch"
    id: ch2_touch
  - platform: template
    name: "CH3 Touch"
    id: ch3_touch
  - platform: template
    name: "CH4 Touch"
    id: ch4_touch

number:
  - platform: template
    name: "Active Layer"
    id: active_layer
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    initial_value: 0
    set_action:
      - fader_buddy.set_active_layer:
          id: fader_1
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_2
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_3
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_4
          layer: !lambda 'return (uint8_t)x;'

  - platform: template
    name: "CH1 Target"
    id: ch1_target
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    set_action:
      - fader_buddy.remote_move_to:
          id: fader_1
          position: !lambda 'return (uint8_t)x;'
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 120

  - platform: template
    name: "CH2 Target"
    id: ch2_target
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    set_action:
      - fader_buddy.remote_move_to:
          id: fader_2
          position: !lambda 'return (uint8_t)x;'
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 120

  - platform: template
    name: "CH3 Target"
    id: ch3_target
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    set_action:
      - fader_buddy.remote_move_to:
          id: fader_3
          position: !lambda 'return (uint8_t)x;'
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 120

  - platform: template
    name: "CH4 Target"
    id: ch4_target
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    set_action:
      - fader_buddy.remote_move_to:
          id: fader_4
          position: !lambda 'return (uint8_t)x;'
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 120

fader_buddy:
  - id: fader_1
    address: 0x20
    update_interval: 10ms
    layer_haptics:
      - layer: 0
        mode: smooth
        default_speed: 120
        value_change_min_interval: 25ms
      - layer: 1
        mode: smooth_with_magnets
        default_speed: 100
        value_change_min_interval: 25ms
      - layer: 2
        mode: detents
        detent_count: 5
        detent_strength: 3
        default_speed: 100
        value_change_min_interval: 25ms
      - layer: 3
        mode: detents
        detent_count: 9
        detent_strength: 2
        default_speed: 100
        value_change_min_interval: 25ms
    on_manual_move:
      then:
        - lambda: |-
            id(ch1_position).publish_state(x);
            id(ch1_target).publish_state(x);
            ESP_LOGI("fader", "CH1 move=%u layer=%u", x, layer);
    on_touch_change:
      then:
        - lambda: |-
            id(ch1_touch).publish_state(x);

  - id: fader_2
