esphome:
  name: faderbuddy-v10
  friendly_name: FaderBuddy V1.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Accelerator6666/FaderBuddy.git
      ref: eight-channel-console
    components: [fader_buddy]

i2c:
  sda: GPIO12
  scl: GPIO13
  scan: true

# V1 uses MQTT only as an application transport. Home Assistant can still use
# the native ESPHome API above; MQTT discovery is disabled to avoid duplicate
# entities in Home Assistant.
mqtt:
  id: console_mqtt
  broker: !secret mqtt_host
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false
  reboot_timeout: 0s

  # PC/automation bridge -> physical faders.
  # Examples:
  #   {"op":"layer","layer":2}
  #   {"op":"move","channel":1,"layer":1,"position":160,"speed":100}
  on_json_message:
    - topic: faderbuddy/console/command
      qos: 0
      then:
        - lambda: |-
            if (!x.containsKey("op")) {
              ESP_LOGW("console", "MQTT command missing op");
              return;
            }

            const std::string op = x["op"].as<std::string>();

            if (op == "layer") {
              if (!x.containsKey("layer")) return;
              const uint8_t layer = std::min<uint8_t>(3, x["layer"].as<uint8_t>());
              id(active_layer).publish_state(layer);
              id(fader_1).set_active_layer(layer);
              id(fader_2).set_active_layer(layer);
              id(fader_3).set_active_layer(layer);
              id(fader_4).set_active_layer(layer);
              id(fader_5).set_active_layer(layer);
              id(fader_6).set_active_layer(layer);
              id(fader_7).set_active_layer(layer);
              id(fader_8).set_active_layer(layer);
              return;
            }

            if (op == "move") {
              if (!x.containsKey("channel") || !x.containsKey("position")) return;
              const uint8_t channel = x["channel"].as<uint8_t>();
              const uint8_t layer = x.containsKey("layer")
                  ? std::min<uint8_t>(3, x["layer"].as<uint8_t>())
                  : (uint8_t) id(active_layer).state;
              const uint8_t position = x["position"].as<uint8_t>();
              const uint8_t speed = x.containsKey("speed")
                  ? x["speed"].as<uint8_t>()
                  : 100;

              switch (channel) {
                case 1: id(fader_1).remote_move_to(position, layer, speed); break;
                case 2: id(fader_2).remote_move_to(position, layer, speed); break;
                case 3: id(fader_3).remote_move_to(position, layer, speed); break;
                case 4: id(fader_4).remote_move_to(position, layer, speed); break;
                case 5: id(fader_5).remote_move_to(position, layer, speed); break;
                case 6: id(fader_6).remote_move_to(position, layer, speed); break;
                case 7: id(fader_7).remote_move_to(position, layer, speed); break;
                case 8: id(fader_8).remote_move_to(position, layer, speed); break;
                default:
                  ESP_LOGW("console", "Invalid channel %u", channel);
                  break;
              }
            }

number:
  - platform: template
    name: "Active Layer"
    id: active_layer
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    initial_value: 0
    set_action:
      - lambda: |-
          const uint8_t layer = (uint8_t)x;
          id(fader_1).set_active_layer(layer);
          id(fader_2).set_active_layer(layer);
          id(fader_3).set_active_layer(layer);
          id(fader_4).set_active_layer(layer);
          id(fader_5).set_active_layer(layer);
          id(fader_6).set_active_layer(layer);
          id(fader_7).set_active_layer(layer);
          id(fader_8).set_active_layer(layer);
          id(console_mqtt).publish_json("faderbuddy/console/event", [=](JsonObject root) {
            root["event"] = "layer";
            root["layer"] = layer;
          });

sensor:
  - platform: template
    name: "Layer Sync Count"
    id: layer_sync_count
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      const uint8_t expected = (uint8_t) id(active_layer).state;
      uint8_t count = 0;
      count += id(fader_1).get_active_layer() == expected;
      count += id(fader_2).get_active_layer() == expected;
      count += id(fader_3).get_active_layer() == expected;
      count += id(fader_4).get_active_layer() == expected;
      count += id(fader_5).get_active_layer() == expected;
      count += id(fader_6).get_active_layer() == expected;
      count += id(fader_7).get_active_layer() == expected;
      count += id(fader_8).get_active_layer() == expected;
      return count;

fader_buddy:
  - id: fader_1
    address: 0x20
    update_interval: 20ms
    layer_haptics:
      - {layer: 0, mode: smooth, default_speed: 100, value_change_min_interval: 25ms}
      - {layer: 1, mode: smooth, default_speed: 100, value_change_min_interval: 25ms}
      - {layer: 2, mode: smooth, default_speed: 100, value_change_min_interval: 25ms}
      - {layer: 3, mode: smooth, default_speed: 100, value_change_min_interval: 25ms}
    on_manual_move:
      then:
        - mqtt.publish_json:
            topic: faderbuddy/console/event
            payload: |-
              root["event"] = "move";
              root["channel"] = 1;
              root["layer"] = layer;
              root["position"] = x;
    on_touch_change:
      then:
        - mqtt.publish_json:
            topic: faderbuddy/console/event
            payload: |-
              root["event"] = "touch";
              root["channel"] = 1;
              root["layer"] = layer;
              root["touched"] = x;
    on_double_tap:
      then:
        - mqtt.publish_json:
            topic: faderbuddy/console/event
            payload: |-
              root["event"] = "double_tap";
              root["channel"] = 1;
              root["layer"] = layer;

