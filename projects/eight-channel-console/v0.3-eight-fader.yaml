esphome:
  name: faderbuddy-v03
  friendly_name: FaderBuddy V0.3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Accelerator6666/FaderBuddy.git
      ref: eight-channel-console
    components: [fader_buddy]

# Keep the first eight-channel bring-up conservative: 50 Hz per fader rather
# than the 100 Hz used by the smaller V0.1/V0.2 tests. Once the full bus is
# proven stable this can be reduced to 10ms if desired.
i2c:
  sda: GPIO12
  scl: GPIO13
  scan: true

sensor:
  - platform: template
    name: "CH1 Position"
    id: ch1_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH2 Position"
    id: ch2_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH3 Position"
    id: ch3_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH4 Position"
    id: ch4_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH5 Position"
    id: ch5_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH6 Position"
    id: ch6_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH7 Position"
    id: ch7_position
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "CH8 Position"
    id: ch8_position
    accuracy_decimals: 0
    update_interval: never

  # Diagnostic: 8 means all physical faders report the layer requested by the
  # global Active Layer control. A temporary lower value is expected if a layer
  # change is requested while a user is touching a fader because FaderBuddy
  # intentionally defers that channel's layer transition until release.
  - platform: template
    name: "Layer Sync Count"
    id: layer_sync_count
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      const uint8_t expected = (uint8_t) id(active_layer).state;
      uint8_t count = 0;
      count += id(fader_1).get_active_layer() == expected;
      count += id(fader_2).get_active_layer() == expected;
      count += id(fader_3).get_active_layer() == expected;
      count += id(fader_4).get_active_layer() == expected;
      count += id(fader_5).get_active_layer() == expected;
      count += id(fader_6).get_active_layer() == expected;
      count += id(fader_7).get_active_layer() == expected;
      count += id(fader_8).get_active_layer() == expected;
      return count;

binary_sensor:
  - platform: template
    name: "CH1 Touch"
    id: ch1_touch
  - platform: template
    name: "CH2 Touch"
    id: ch2_touch
  - platform: template
    name: "CH3 Touch"
    id: ch3_touch
  - platform: template
    name: "CH4 Touch"
    id: ch4_touch
  - platform: template
    name: "CH5 Touch"
    id: ch5_touch
  - platform: template
    name: "CH6 Touch"
    id: ch6_touch
  - platform: template
    name: "CH7 Touch"
    id: ch7_touch
  - platform: template
    name: "CH8 Touch"
    id: ch8_touch

number:
  - platform: template
    name: "Active Layer"
    id: active_layer
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    initial_value: 0
    set_action:
      - fader_buddy.set_active_layer:
          id: fader_1
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_2
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_3
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_4
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_5
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_6
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_7
          layer: !lambda 'return (uint8_t)x;'
      - fader_buddy.set_active_layer:
          id: fader_8
          layer: !lambda 'return (uint8_t)x;'

  - platform: template
    name: "CH1 Target"
    id: ch1_target
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    set_action:
      - fader_buddy.remote_move_to:
          id: fader_1
          position: !lambda 'return (uint8_t)x;'
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 100

