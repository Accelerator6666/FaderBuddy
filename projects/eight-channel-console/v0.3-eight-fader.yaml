button:
  # Staggered rather than simultaneous motion is intentional for first power-up.
  # Validate the motor rail before adding any simultaneous full-bank sweep test.
  - platform: template
    name: "Staggered Center Test"
    on_press:
      - fader_buddy.remote_move_to:
          id: fader_1
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80
      - delay: 150ms
      - fader_buddy.remote_move_to:
          id: fader_2
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80
      - delay: 150ms
      - fader_buddy.remote_move_to:
          id: fader_3
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80
      - delay: 150ms
      - fader_buddy.remote_move_to:
          id: fader_4
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80
      - delay: 150ms
      - fader_buddy.remote_move_to:
          id: fader_5
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80
      - delay: 150ms
      - fader_buddy.remote_move_to:
          id: fader_6
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80
      - delay: 150ms
      - fader_buddy.remote_move_to:
          id: fader_7
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80
      - delay: 150ms
      - fader_buddy.remote_move_to:
          id: fader_8
          position: 128
          layer: !lambda 'return (uint8_t)id(active_layer).state;'
          speed: 80

fader_buddy:
  - id: fader_1
    address: 0x20
    update_interval: 20ms
    layer_haptics:
      - layer: 0
        mode: smooth
        default_speed: 100
        value_change_min_interval: 25ms
      - layer: 1
        mode: smooth_with_magnets
        default_speed: 100
        value_change_min_interval: 25ms
      - layer: 2
        mode: detents
        detent_count: 5
        detent_strength: 3
        default_speed: 100
        value_change_min_interval: 25ms
      - layer: 3
        mode: detents
        detent_count: 9
        detent_strength: 2
        default_speed: 100
        value_change_min_interval: 25ms
    on_manual_move:
      then:
        - lambda: |-
            id(ch1_position).publish_state(x);
            id(ch1_target).publish_state(x);
            ESP_LOGI("fader", "CH1 move=%u layer=%u", x, layer);
    on_touch_change:
      then:
        - lambda: |-
            id(ch1_touch).publish_state(x);

